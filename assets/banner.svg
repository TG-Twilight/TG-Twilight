<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Simon Twilight</title>
  <desc id="d">The SuperCowboy who lives forever in the sunset</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#120A24"/>
      <stop offset="22%"  stop-color="#341450"/>
      <stop offset="44%"  stop-color="#7E2560"/>
      <stop offset="62%"  stop-color="#D9464F"/>
      <stop offset="78%"  stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FFC96B"/>
    </linearGradient>

    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFF2BC"/>
      <stop offset="38%"  stop-color="#FFD166"/>
      <stop offset="72%"  stop-color="#FF7A45"/>
      <stop offset="100%" stop-color="#FF4E62"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="55%"  stop-color="#FF8C42" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF8C42" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FF8A3D" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFB05C" stop-opacity="0.30"/>
    </linearGradient>

    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFF0C4"/>
      <stop offset="45%"  stop-color="#FFC46B"/>
      <stop offset="100%" stop-color="#FF6A6E"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7B4B94"/>
      <stop offset="50%"  stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#FF5F6D"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFD166" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF5F6D" stop-opacity="0"/>
    </linearGradient>

    <!-- retro scan-lines carved out of the setting sun -->
    <mask id="slats">
      <rect x="780" y="70" width="240" height="180" fill="#fff"/>
      <g fill="#000">
        <rect x="780" y="146" width="240" height="3"/>
        <rect x="780" y="159" width="240" height="4"/>
        <rect x="780" y="174" width="240" height="5"/>
        <rect x="780" y="191" width="240" height="7"/>
        <rect x="780" y="211" width="240" height="9"/>
      </g>
    </mask>

    <clipPath id="frame"><rect x="0" y="0" width="1200" height="300" rx="16"/></clipPath>
    <clipPath id="wipeName"><rect x="56" y="98" width="0" height="64">
      <animate attributeName="width" from="0" to="608" dur="1.5s" begin="0.35s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="wipeSub"><rect x="58" y="172" width="0" height="30">
      <animate attributeName="width" from="0" to="566" dur="1.5s" begin="2.2s" fill="freeze"/>
    </rect></clipPath>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#2A0716" flood-opacity="0.75"/>
    </filter>

    <g id="cactus">
      <path d="M-3,0 L-3,-26 Q-3,-30 0,-30 Q3,-30 3,-26 L3,0 Z"/>
      <path d="M-3,-14 L-8.5,-14 Q-11.5,-14 -11.5,-11 L-11.5,-4 L-8,-4 L-8,-10.5 L-3,-10.5 Z"/>
      <path d="M3,-19 L8,-19 Q11,-19 11,-16 L11,-7 L7.5,-7 L7.5,-15.5 L3,-15.5 Z"/>
    </g>

    <g id="bird" fill="none" stroke-width="1.7" stroke-linecap="round">
      <path d="M0,0 q4.5,-4 9,0 q4.5,-4 9,0"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#FFF3D6">
      <circle cx="52"   cy="26" r="1.5" opacity=".9"><animate attributeName="opacity" values=".9;.2;.9" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="148"  cy="52" r="1.1" opacity=".6"><animate attributeName="opacity" values=".6;.15;.6" dur="4.3s" repeatCount="indefinite"/></circle>
      <circle cx="236"  cy="20" r="1.7" opacity=".85"><animate attributeName="opacity" values=".85;.25;.85" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="332"  cy="44" r="1.2" opacity=".7"><animate attributeName="opacity" values=".7;.2;.7" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="430"  cy="18" r="1.4" opacity=".8"><animate attributeName="opacity" values=".8;.2;.8" dur="4.9s" repeatCount="indefinite"/></circle>
      <circle cx="524"  cy="58" r="1"   opacity=".55"><animate attributeName="opacity" values=".55;.1;.55" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="628"  cy="28" r="1.6" opacity=".85"><animate attributeName="opacity" values=".85;.2;.85" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="726"  cy="50" r="1.1" opacity=".6"><animate attributeName="opacity" values=".6;.15;.6" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="836"  cy="22" r="1.3" opacity=".75"><animate attributeName="opacity" values=".75;.2;.75" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="944"  cy="46" r="1.5" opacity=".8"><animate attributeName="opacity" values=".8;.25;.8" dur="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="1046" cy="24" r="1.1" opacity=".6"><animate attributeName="opacity" values=".6;.15;.6" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="1132" cy="56" r="1.4" opacity=".8"><animate attributeName="opacity" values=".8;.2;.8" dur="3.9s" repeatCount="indefinite"/></circle>
      <circle cx="1178" cy="16" r="1"   opacity=".5"><animate attributeName="opacity" values=".5;.12;.5" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="88"   cy="74" r="1"   opacity=".45"><animate attributeName="opacity" values=".45;.1;.45" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="990"  cy="76" r="1.2" opacity=".55"><animate attributeName="opacity" values=".55;.15;.55" dur="3.0s" repeatCount="indefinite"/></circle>
    </g>

    <!-- the sun, slatted, setting behind the mesa -->
    <circle cx="900" cy="190" r="152" fill="url(#halo)"/>
    <circle cx="900" cy="190" r="100" fill="url(#sun)" mask="url(#slats)"/>

    <!-- warm horizon haze -->
    <rect x="0" y="180" width="1200" height="120" fill="url(#haze)"/>

    <!-- drifting birds, catching the last light -->
    <g stroke="#FFC08F" opacity=".45">
      <g transform="translate(688,112)"><use href="#bird">
        <animateTransform attributeName="transform" type="translate" values="0,0; 54,-12; 0,0" dur="15s" repeatCount="indefinite"/>
      </use></g>
      <g transform="translate(752,90) scale(0.72)"><use href="#bird">
        <animateTransform attributeName="transform" type="translate" values="0,0; -46,10; 0,0" dur="19s" repeatCount="indefinite"/>
      </use></g>
    </g>

    <!-- distant range -->
    <path fill="#4A2154" opacity=".95"
      d="M0,254 L80,236 L150,252 L230,240 L310,256 L390,242 L470,258 L550,244 L630,258 L700,246 L780,258 L1200,258 L1200,300 L0,300 Z"/>

    <!-- mesas, and the big butte the cowboy stands on -->
    <path fill="#2B1038"
      d="M0,276 L120,276 L136,254 L300,254 L316,276 L560,276 L576,264 L648,264 L664,276 L690,276 L706,232 L1064,232 L1080,276 L1200,276 L1200,300 L0,300 Z"/>

    <!-- the SuperCowboy, dead centre of the sun -->
    <g fill="#1C0A26" transform="translate(872,232)">
      <path d="M-6,-16 L-6.5,-1 L-1.8,-1 L-1.5,-16 Z"/>
      <path d="M1.5,-16 L1.8,-1 L6.5,-1 L6,-16 Z"/>
      <path d="M-8.8,-2.6 L-1.8,-2.6 L-1.8,0 L-8.8,0 Z"/>
      <path d="M1.8,-2.6 L8.8,-2.6 L8.8,0 L1.8,0 Z"/>
      <path d="M-7.5,-39 Q0,-43 7.5,-39 L11.5,-14 L-11.5,-14 Z"/>
      <path d="M-7.5,-37 L-12.5,-19 L-9,-18 L-4.5,-35 Z"/>
      <path d="M7.5,-37 L12.5,-19 L9,-18 L4.5,-35 Z"/>
      <circle cx="0" cy="-44" r="4.6"/>
      <path d="M-5.5,-47 L-6,-54 Q0,-58.5 6,-54 L5.5,-47 Z"/>
      <ellipse cx="0" cy="-47.5" rx="14.5" ry="3.4"/>
    </g>

    <!-- near ground and saguaros -->
    <path fill="#170820" d="M0,278 L1200,278 L1200,300 L0,300 Z"/>
    <g fill="#2B1038"><use href="#cactus" transform="translate(214,254) scale(0.55)"/></g>
    <g fill="#170820">
      <use href="#cactus" transform="translate(96,278) scale(0.95)"/>
      <use href="#cactus" transform="translate(1146,278) scale(0.7)"/>
    </g>

    <!-- type -->
    <text x="66" y="92" fill="#FFC48A" opacity="0"
          font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace"
          font-size="13" textLength="304" lengthAdjust="spacing">MOUNTAIN OF FAITH &#183; UTC+08:00<animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0s" fill="freeze"/></text>
    <rect x="66" y="100" width="0" height="2" fill="url(#rule)">
      <animate attributeName="width" from="0" to="330" dur="0.8s" begin="0.1s" fill="freeze"/>
    </rect>

    <g clip-path="url(#wipeName)">
      <text x="64" y="152" fill="url(#ink)" filter="url(#soft)"
            font-family="Georgia,'Times New Roman','Noto Serif',serif" font-weight="700"
            font-size="56" textLength="580" lengthAdjust="spacing">SIMON TWILIGHT</text>
    </g>
    <rect x="64" y="112" width="4" height="44" fill="#FFD166" opacity="0">
      <set attributeName="opacity" to="1" begin="0.35s"/>
      <animate attributeName="x" from="64" to="648" dur="1.5s" begin="0.35s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0" dur="0.75s" begin="1.85s" repeatCount="indefinite"/>
      <set attributeName="opacity" to="0" begin="2.2s"/>
    </rect>

    <g clip-path="url(#wipeSub)">
      <text x="66" y="192" fill="#F6DCC6" opacity=".92" filter="url(#soft)"
            font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace"
            font-size="17" textLength="540" lengthAdjust="spacing">The SuperCowboy who lives forever in the sunset</text>
    </g>
    <rect x="66" y="177" width="3" height="20" fill="#FFD166" opacity="0">
      <set attributeName="opacity" to="1" begin="2.2s"/>
      <animate attributeName="x" from="66" to="610" dur="1.5s" begin="2.2s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" begin="3.75s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1198" height="298" rx="16" fill="none" stroke="url(#edge)" stroke-width="2" opacity=".6"/>
</svg>
